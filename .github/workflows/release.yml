name: Build & Release

# Baut auf echten Windows-, Linux- und macOS-Runnern (nicht per Emulation) und lädt
# die fertigen Pakete an das GitHub-Release des Tags an. .deb/.pacman brauchen das
# Linux-Tool "fpm", das nur unter Linux läuft - daher hier statt lokal.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # zum Hochladen der Pakete ans GitHub-Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
