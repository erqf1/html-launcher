<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Downloads</title>
  <link rel="stylesheet" href="bubble.css">
</head>
<body>
  <div id="root" class="root">
    <button id="fab" class="fab" type="button" title="Downloads (Strg+J)" aria-label="Downloads" hidden>
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="ring-track" cx="22" cy="22" r="19"/>
        <circle id="ring" class="ring-value" cx="22" cy="22" r="19"/>
      </svg>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg>
      <span id="fab-dot" class="fab-dot" hidden></span>
    </button>

    <section id="panel" class="panel" aria-label="Downloads" hidden>
      <header class="panel-head">
        <h1>Downloads</h1>
        <button id="close" class="icon-btn" type="button" title="Schließen (Esc)" aria-label="Schließen">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="list" class="list"></div>
      <p id="empty" class="empty" hidden>Noch keine Downloads in diesem Programm.</p>
      <footer class="panel-foot">
        <button id="all" class="link" type="button">Alle Downloads anzeigen</button>
        <span class="hint"><kbd id="mod">Strg</kbd>+<kbd>J</kbd></span>
      </footer>
    </section>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
