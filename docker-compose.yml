# Zwei unabhängige Dienste:
#
#   docker compose up web -d          Website unter http://localhost:8080
#   docker compose run --rm build     baut .deb/.pacman/.tar.gz nach ./dist
#
# "web" hostet nur die statische Seite aus ./docs (kein Node nötig; der Ordner
# liegt nur lokal, nicht im Git-Repo, siehe .gitignore). "build" ist extra für
# Linux: das dafür nötige Werkzeug "fpm" gibt es nur für Linux/macOS, ein
# Container ist hier der einfachste Weg, es trotzdem von Windows aus zu bauen.
# Windows- und macOS-Pakete entstehen über GitHub Actions (.github/workflows/release.yml).
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    restart: unless-stopped

  build:
    build: .
    volumes:
      - ./dist:/app/dist
